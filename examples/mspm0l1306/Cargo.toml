[package]
edition = "2024"
name = "embassy-mspm0-l1306-examples"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
embassy-mspm0 = { version = "0.1.0", path = "../../embassy-mspm0", features = ["mspm0l1306rhb", "defmt", "rt", "time-driver-any"] }
embassy-executor = { version = "0.10.0", path = "../../embassy-executor", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-sync = { version = "0.8.0", path = "../../embassy-sync", features = ["defmt"] }
embassy-time = { version = "0.5.1", path = "../../embassy-time", features = ["defmt"] }
embassy-futures = { version = "0.1.2", path = "../../embassy-futures" }
embedded-io-async = { version = "0.7.0" }
panic-halt = "1.0.0"
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = { version = "0.7.0"}
defmt = "1.0.1"
# Non-blocking: probe-rs puts RTT into blocking mode, and a full buffer then stalls inside a critical
# section for milliseconds, which is long enough to overrun a UART FIFO. Dropped log bytes are the
# cheaper loss.
defmt-rtt = { version = "1.0.0", features = ["disable-blocking-mode"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
panic-semihosting = "0.6.0"

[features]
# The measurement binaries, which link no logger at all. That is what they are for -- RTT's buffer is a
# kilobyte of RAM and a probe attached to drain it holds the device out of the idle being measured --
# and it is also why they are the only binaries here that need `DEFMT_LOG=off` to link. Gating them
# keeps a plain `cargo build` working for everything else.
bench = []

[[bin]]
name = "wake_edge"
required-features = ["bench"]

[[bin]]
name = "clock_witness"
required-features = ["bench"]

[profile.release]
# Matches what actually gets flashed. Without these a release build has no LTO and
# `opt-level = 3`, which is roughly 3x larger and makes size comparisons meaningless.
debug = 2
opt-level = "z"
lto = true
codegen-units = 1

[profile.dev]
debug = 2
opt-level = 2

[package.metadata.embassy]
build = [
  { target = "thumbv6m-none-eabi", artifact-dir = "out/examples/mspm0l1306" }
]
