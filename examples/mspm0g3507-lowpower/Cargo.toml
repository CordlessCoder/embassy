[package]
edition = "2024"
name = "embassy-mspm0-g3507-lowpower-examples"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# `executor-thread` provides the executor that deep-sleeps on idle, so `embassy-executor` must not
# also select a platform of its own. It implies `low-power` — that executor is nothing else — but
# `low-power` is listed anyway: it is what these binaries are for, and a crate that says so does not
# have to be read backwards through a private feature to find out.
#
# `unsafe-atomics-single-core` shortens a GPIO wake, which is current drawn before the chip can sleep
# again. It needs `default-features = false`, hence the explicit `rt`.
embassy-mspm0 = { version = "0.1.0", path = "../../embassy-mspm0", default-features = false, features = ["mspm0g3507pm", "defmt", "rt", "time-driver-any", "time", "executor-thread", "executor-interrupt", "low-power", "unstable-pac", "unsafe-atomics-single-core"] }
embassy-executor = { version = "0.10.0", path = "../../embassy-executor" }
embassy-sync = { version = "0.8.0", path = "../../embassy-sync", features = ["defmt"] }
embassy-time = { version = "0.5.1", path = "../../embassy-time", features = ["defmt"] }
panic-halt = "1.0.0"
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
# `gpio_waiters` drops a wait inside a section it holds across a scope end, which `with` cannot express.
critical-section = "1.2.0"
cortex-m-rt = { version = "0.7.0"}
defmt = "1.0.1"
# Non-blocking: probe-rs puts RTT into blocking mode, and a full buffer then stalls inside a critical
# section for milliseconds, which is long enough to overrun a UART FIFO. Dropped log bytes are the
# cheaper loss.
defmt-rtt = { version = "1.0.0", features = ["disable-blocking-mode"] }

embedded-io-async = { version = "0.7.0" }

[features]
# Bench instrumentation, off by default and opt-in per binary. It puts marker calls inside the GPIO
# handler, which is 120 cycles on every wake — left on crate-wide it made `wake_cycles` measure itself,
# and every entry figure taken here before 2026-08-11 describes an instrumented handler.
_probe = ["embassy-mspm0/_probe"]

[[bin]]
name = "wake_latency_probe"
required-features = ["_probe"]

[profile.release]
# Matches what actually gets flashed. Without these a release build has no LTO and
# `opt-level = 3`, which is roughly 3x larger and makes size comparisons meaningless.
debug = 2
opt-level = "z"
lto = true
codegen-units = 1

[package.metadata.embassy]
build = [
  { target = "thumbv6m-none-eabi", artifact-dir = "out/examples/mspm0g3507-lowpower" }
]
