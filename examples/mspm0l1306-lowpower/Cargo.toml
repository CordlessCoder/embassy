[package]
edition = "2024"
name = "embassy-mspm0-l1306-lowpower-examples"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# `executor-thread` here brings in `low-power` and provides the executor that deep-sleeps on idle, so
# `embassy-executor` must not also select a platform of its own.
#
# `unsafe-atomics-single-core` shortens a GPIO wake, which is current drawn before the chip can sleep
# again. It needs `default-features = false`, hence the explicit `rt`.
embassy-mspm0 = { version = "0.1.0", path = "../../embassy-mspm0", default-features = false, features = ["mspm0l1306rhb", "defmt", "rt", "time-driver-any", "time", "executor-thread", "unstable-pac", "_probe", "unsafe-atomics-single-core"] }
embassy-executor = { version = "0.10.0", path = "../../embassy-executor" }
embassy-sync = { version = "0.8.0", path = "../../embassy-sync", features = ["defmt"] }
embassy-time = { version = "0.5.1", path = "../../embassy-time", features = ["defmt"] }
panic-halt = "1.0.0"
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
# `gpio_waiters` drops a wait inside a section it holds across a scope end, which `with` cannot express.
critical-section = "1.2.0"
cortex-m-rt = { version = "0.7.0"}
defmt = "1.0.1"
defmt-rtt = "1.0.0"

# `bor` is the only binary that selects a brown-out warning level, and the feature it needs is not
# free: on this part it puts a save/restore into every deep-sleep entry. Left off the crate so the
# wake-latency binaries here keep measuring a sleep path with nothing extra in it.
[features]
bor-warning = ["embassy-mspm0/bor-warning"]

[[bin]]
name = "bor"
required-features = ["bor-warning"]

[profile.release]
# Matches what actually gets flashed. Without these a release build has no LTO and
# `opt-level = 3`, which is roughly 3x larger and makes size comparisons meaningless.
debug = 2
opt-level = "z"
lto = true
codegen-units = 1

[package.metadata.embassy]
build = [
  { target = "thumbv6m-none-eabi", artifact-dir = "out/examples/mspm0l1306-lowpower" }
]
